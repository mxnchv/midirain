<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>midirain preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>
  /* Vista previa fuera de Live: ejecuta midirain_engine.js y midirain_ui.js tal cual,
     con stubs de outlet / Global / mgraphics sobre un canvas. Sin audio. */
  :root { --grey-dim: rgba(255,255,255,0.35); color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #fff; font-family: 'Space Mono', 'Courier New', monospace;
         min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .device { display: flex; border: 1px solid #1c1c1c; max-width: 100%; }
  canvas { display: block; width: 300px; height: 169px; border-right: 1px solid #1c1c1c; }
  .ctl { width: 280px; height: 169px; padding: 8px 12px; display: grid; grid-template-columns: 1fr 1fr;
         gap: 4px 12px; font-size: 9px; color: rgba(255,255,255,0.5); align-content: start; }
  label { display: flex; flex-direction: column; gap: 2px; }
  input[type=range] { accent-color: #fff; width: 100%; }
  select, input[type=number] { background: #000; color: #fff; border: 1px solid rgba(255,255,255,0.35);
         font: inherit; font-size: 9px; padding: 1px 2px; }
  .log { position: fixed; bottom: 12px; left: 16px; right: 16px; font-size: 10px;
         color: var(--grey-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 620px) { .device { flex-direction: column; } canvas { border-right: 0; border-bottom: 1px solid #1c1c1c; } }
</style>
</head>
<body>
<div class="device">
  <canvas id="c" width="600" height="338"></canvas>
  <div class="ctl" id="ctl"></div>
</div>
<div class="log" id="log">—</div>
<script>
(async function () {
  var W = 300, H = 169, DPR = 2;
  var cv = document.getElementById('c');
  var g = cv.getContext('2d');
  var globals = {};
  function Global(name) { return globals[name] || (globals[name] = {}); }

  // mgraphics sobre canvas 2D (subconjunto que usa midirain_ui.js)
  var font = { face: 'Space Mono', size: 8 };
  var mg = {
    relative_coords: 0, autofill: 0, size: [W, H],
    init: function () {}, redraw: function () { dirty = true; },
    set_source_rgba: function (r, gg, b, a) { var c = 'rgba(' + (r * 255 | 0) + ',' + (gg * 255 | 0) + ',' + (b * 255 | 0) + ',' + a + ')'; g.fillStyle = c; g.strokeStyle = c; },
    pattern_create_linear: function (x1, y1, x2, y2) {
      var gr = g.createLinearGradient(x1, y1, x2, y2);
      return { add_color_stop_rgba: function (o, r, gg, b, a) { gr.addColorStop(o, 'rgba(' + (r * 255 | 0) + ',' + (gg * 255 | 0) + ',' + (b * 255 | 0) + ',' + a + ')'); }, _g: gr };
    },
    rectangle: function (x, y, w, h) { g.rect(x, y, w, h); },
    ellipse: function (x, y, w, h) { g.moveTo(x + w, y + h / 2); g.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2); },
    move_to: function (x, y) { g.moveTo(x, y); }, line_to: function (x, y) { g.lineTo(x, y); },
    arc: function (x, y, r, a1, a2) { g.arc(x, y, r, a1, a2); },
    fill: function () { g.fill(); g.beginPath(); }, stroke: function () { g.stroke(); g.beginPath(); },
    save: function () { g.save(); }, restore: function () { g.restore(); },
    translate: function (x, y) { g.translate(x, y); }, scale: function (x, y) { g.scale(x, y); },
    set_line_width: function (w) { g.lineWidth = w; }, set_line_cap: function (c) { g.lineCap = c; },
    select_font_face: function (f) { font.face = f; g.font = font.size + 'px "' + font.face + '"'; },
    set_font_size: function (s) { font.size = s; g.font = font.size + 'px "' + font.face + '"'; },
    text_measure: function (s) { return [g.measureText(s).width, font.size]; }
  };
  // show_text dibuja en el punto actual: lo guardamos en move_to
  var pt = [0, 0];
  var mt = mg.move_to; mg.move_to = function (x, y) { pt = [x, y]; mt(x, y); };
  mg.show_text = function (s) { g.fillText(s, pt[0], pt[1]); pt[0] += g.measureText(s).width; };
  mg.set_source = function (p) { g.fillStyle = p._g; g.strokeStyle = p._g; };

  var NAMES = ['bang', 'tick', 'grid', 'note', 'density', 'fall', 'wind', 'dur', 'mode', 'tonic', 'scale', 'low', 'high', 'sync', 'draw', 'paint'];
  function load(src, env) {
    var ret = '{' + NAMES.map(function (n) { return n + ': typeof ' + n + ' === "function" ? ' + n + ' : null'; }).join(',') + '}';
    var f = new Function('outlet', 'Global', 'jsarguments', 'mgraphics', 'box', 'post',
      'var inlets, outlets, autowatch;\n' + src + '\nreturn ' + ret + ';');
    return f(env.outlet, Global, env.jsarguments, mg, { rect: [0, 0, W, H] }, function () {});
  }

  var dirty = false, notes = [];
  var log = document.getElementById('log');
  var NN = ['c', 'c#', 'd', 'd#', 'e', 'f', 'f#', 'g', 'g#', 'a', 'a#', 'b'];
  var ui = load(await (await fetch('../midirain_ui.js')).text(), { jsarguments: ['midirain_ui.js'] });
  var engine = load(await (await fetch('../midirain_engine.js')).text(), {
    jsarguments: ['midirain_engine.js', 'preview'],
    outlet: function (n) {
      var a = Array.prototype.slice.call(arguments, 1);
      if (n === 0) {
        notes.unshift(NN[a[0] % 12] + (Math.floor(a[0] / 12) - 2) + ' ' + a[1]);
        notes.length = Math.min(notes.length, 16);
        log.textContent = notes.join('  ');
      } else if (n === 1) ui.draw(a[1]);
    }
  });
  window.midirain = { engine: engine, ui: ui };

  // controles mínimos
  var ctl = document.getElementById('ctl');
  function add(html, sel, fn) {
    var l = document.createElement('label'); l.innerHTML = html; ctl.appendChild(l);
    var el = l.querySelector(sel); el.addEventListener('input', function () { fn(el); }); fn(el);
  }
  add('densidad<input type=range min=0 max=100 value=30>', 'input', function (e) { engine.density(+e.value); });
  add('caída<input type=range min=0 max=100 value=40>', 'input', function (e) { engine.fall(+e.value); });
  add('viento<input type=range min=-100 max=100 value=0>', 'input', function (e) { engine.wind(+e.value); });
  add('modo<select><option>escala<option>midi</select>', 'select', function (e) { engine.mode(e.selectedIndex); });
  add('tónica<select>' + NN.map(function (n) { return '<option>' + n; }).join('') + '</select>', 'select', function (e) { engine.tonic(e.selectedIndex); });
  add('escala<select><option>mayor<option selected>menor<option>dórica<option>frigia<option>lidia<option>mixolidia<option>menor armónica<option>pentatónica mayor<option>pentatónica menor<option>blues<option>cromática</select>', 'select', function (e) { engine.scale(e.selectedIndex); });
  add('grave<input type=number min=0 max=127 value=48>', 'input', function (e) { engine.low(+e.value); });
  add('aguda<input type=number min=0 max=127 value=72>', 'input', function (e) { engine.high(+e.value); });

  setInterval(engine.bang, 10);
  (function frame() {
    requestAnimationFrame(frame);
    if (!dirty) return;
    dirty = false;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.beginPath();
    ui.paint();
  })();
})().catch(function (e) { document.getElementById('log').textContent = 'error: ' + e.message; throw e; });
</script>
</body>
</html>
