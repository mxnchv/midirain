<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>midirain preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>
  /* Vista previa fuera de Live: ejecuta midirain_engine.js, midirain_ui.js y
     midirain_knob.js tal cual, con stubs de outlet / Global / mgraphics sobre
     canvas. Los menús son HTML en el sitio de los live.*. Sin audio. */
  :root { --grey-dim: rgba(255,255,255,0.35); color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #fff; font-family: 'Space Mono', 'Courier New', monospace;
         min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .device { position: relative; width: 590px; height: 169px; outline: 1px solid #1c1c1c; background: #000; }
  #c { display: block; width: 300px; height: 169px; }
  .sep { position: absolute; left: 302px; top: 0; width: 1px; height: 169px; background: #1c1c1c; }
  #panel > * { position: absolute; }
  #panel canvas { width: 60px; height: 72px; cursor: ns-resize; touch-action: none; }
  #panel .lbl { font-size: 8px; color: rgba(255,255,255,0.5); }
  #panel .credit { font-size: 8px; color: rgba(255,255,255,0.35); }
  select, input[type=number] { background: #000; color: #fff; border: 1px solid rgba(255,255,255,0.3);
         font: inherit; font-size: 8px; height: 15px; padding: 0 3px; border-radius: 0; }
  .tabs { display: flex; }
  .tabs button { width: 38px; height: 14px; font: inherit; font-size: 8px; background: #000;
         color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.3); }
  .tabs button.on { background: #fff; color: #000; }
  .log { position: fixed; bottom: 12px; left: 16px; right: 16px; font-size: 10px;
         color: var(--grey-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 640px) { .device { transform: scale(0.6); transform-origin: center; } }
</style>
</head>
<body>
<div class="device">
  <canvas id="c" width="900" height="507"></canvas>
  <div class="sep"></div>
  <div id="panel"></div>
</div>
<div class="log" id="log">—</div>
<script>
(async function () {
  var W = 300, H = 169, DPR = 3;
  var globals = {};
  function Global(name) { return globals[name] || (globals[name] = {}); }

  // mgraphics sobre canvas 2D (subconjunto que usan los jsui de midirain)
  function rgba(r, gg, b, a) { return 'rgba(' + (r * 255 | 0) + ',' + (gg * 255 | 0) + ',' + (b * 255 | 0) + ',' + a + ')'; }
  function makeMg(canvas, w, h) {
    var main = canvas.getContext('2d');
    var g = main;
    var font = { face: 'Space Mono', size: 8 };
    var pt = [0, 0];
    var glyphs = [];        // text_path pendiente
    var pathOps = [];       // move_to / arc / … pendientes de un clip()
    var recording = false;
    var masks = [];         // pila de save(): recorte por texto activo en ese nivel
    function rec(op, args) { if (recording) pathOps.push([op, args]); }
    function setFont() { g.font = font.size + 'px "' + font.face + '"'; }
    function grad(gr) {
      return { _g: gr, add_color_stop_rgba: function (o, r, gg, b, a) { gr.addColorStop(o, rgba(r, gg, b, a)); } };
    }
    var mg = {
      relative_coords: 0, autofill: 0, size: [w, h], dirty: true,
      init: function () {}, redraw: function () { mg.dirty = true; },
      set_source_rgba: function (r, gg, b, a) { g.fillStyle = g.strokeStyle = rgba(r, gg, b, a); },
      set_source: function (p) { g.fillStyle = g.strokeStyle = p._g; },
      pattern_create_linear: function (x1, y1, x2, y2) { return grad(g.createLinearGradient(x1, y1, x2, y2)); },
      pattern_create_radial: function (x1, y1, r1, x2, y2, r2) { return grad(g.createRadialGradient(x1, y1, r1, x2, y2, r2)); },
      rectangle: function (x, y, ww, hh) { g.rect(x, y, ww, hh); },
      ellipse: function (x, y, ww, hh) { g.moveTo(x + ww, y + hh / 2); g.ellipse(x + ww / 2, y + hh / 2, ww / 2, hh / 2, 0, 0, Math.PI * 2); },
      move_to: function (x, y) { pt = [x, y]; rec('moveTo', [x, y]); g.moveTo(x, y); },
      line_to: function (x, y) { rec('lineTo', [x, y]); g.lineTo(x, y); },
      arc: function (x, y, r, a1, a2) { rec('arc', [x, y, r, a1, a2]); g.arc(x, y, r, a1, a2); },
      arc_negative: function (x, y, r, a1, a2) { rec('arc', [x, y, r, a1, a2, true]); g.arc(x, y, r, a1, a2, true); },
      close_path: function () { rec('closePath', []); g.closePath(); },
      fill: function () { g.fill(); g.beginPath(); }, stroke: function () { g.stroke(); g.beginPath(); },
      translate: function (x, y) { g.translate(x, y); }, scale: function (x, y) { g.scale(x, y); },
      set_line_width: function (lw) { g.lineWidth = lw; }, set_line_cap: function (c) { g.lineCap = c; },
      select_font_face: function (f) { font.face = f; setFont(); },
      set_font_size: function (sz) { font.size = sz; setFont(); },
      text_measure: function (str) { return [g.measureText(str).width, font.size]; },
      show_text: function (str) { g.fillText(str, pt[0], pt[1]); pt[0] += g.measureText(str).width; },
      // canvas no recorta por texto: lo imitamos pintando en un canvas aparte y
      // enmascarándolo con las letras al hacer restore()
      text_path: function (str) { glyphs.push({ s: str, x: pt[0], y: pt[1], font: g.font, m: g.getTransform() }); pt[0] += g.measureText(str).width; },
      clip: function () {
        var off = document.createElement('canvas');
        off.width = canvas.width; off.height = canvas.height;
        var og = off.getContext('2d');
        og.setTransform(g.getTransform());
        og.font = g.font; og.lineCap = g.lineCap; og.lineWidth = g.lineWidth;
        // trazado geométrico pendiente (p. ej. el arco del knob): se rellena en la máscara
        var shape = document.createElement('canvas');
        shape.width = canvas.width; shape.height = canvas.height;
        var sg = shape.getContext('2d');
        sg.setTransform(g.getTransform());
        sg.fillStyle = '#fff';
        if (pathOps.length) { sg.beginPath(); pathOps.forEach(function (op) { sg[op[0]].apply(sg, op[1]); }); sg.fill(); }
        masks[masks.length - 1] = { off: off, glyphs: glyphs, shape: shape, parent: g };
        glyphs = [];
        recording = false;
        g.beginPath();
        g = og;
      },
      save: function () { g.save(); masks.push(null); pathOps = []; recording = true; },
      restore: function () {
        var m = masks.pop();
        if (m) {
          var og = g;
          var mask = document.createElement('canvas');
          mask.width = canvas.width; mask.height = canvas.height;
          var mk = mask.getContext('2d');
          mk.fillStyle = '#fff';
          mk.drawImage(m.shape, 0, 0);
          m.glyphs.forEach(function (gl) { mk.setTransform(gl.m); mk.font = gl.font; mk.fillText(gl.s, gl.x, gl.y); });
          og.setTransform(1, 0, 0, 1, 0, 0);
          og.globalCompositeOperation = 'destination-in';
          og.drawImage(mask, 0, 0);
          g = m.parent;
          var t = g.getTransform();
          g.setTransform(1, 0, 0, 1, 0, 0);
          g.drawImage(m.off, 0, 0);
          g.setTransform(t);
        }
        g.restore();
        glyphs = [];
        recording = false;
        pathOps = [];
      },
      frame: function (paint) {
        if (!mg.dirty) return;
        mg.dirty = false;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, canvas.width, canvas.height);    // como jsui: cada paint empieza vacío
        g.setTransform(DPR, 0, 0, DPR, 0, 0);
        g.beginPath();
        paint();
      }
    };
    return mg;
  }

  function Task(fn) { this.fn = fn; this.id = null; }
  Task.prototype.schedule = function (ms) { var t = this; clearTimeout(t.id); t.id = setTimeout(function () { t.fn(); }, ms || 0); };
  Task.prototype.cancel = function () { clearTimeout(this.id); };

  var NAMES = ['bang', 'tick', 'grid', 'note', 'density', 'fall', 'wind', 'dur', 'mode', 'tonic', 'scale',
    'low', 'high', 'sync', 'draw', 'paint', 'msg_float'];
  function load(src, env) {
    var ret = '{' + NAMES.map(function (n) { return n + ': typeof ' + n + ' === "function" ? ' + n + ' : null'; }).join(',') + '}';
    var f = new Function('outlet', 'Global', 'jsarguments', 'mgraphics', 'box', 'post', 'Task',
      'var inlets, outlets, autowatch;\n' + src + '\nreturn ' + ret + ';');
    return f(env.outlet || function () {}, Global, env.jsarguments, env.mg, { rect: [0, 0].concat(env.mg ? env.mg.size : [0, 0]) }, function () {}, Task);
  }

  await document.fonts.load('9px "Space Mono"');
  var cv = document.getElementById('c');
  var panel = document.getElementById('panel');
  var log = document.getElementById('log');
  var notes = [];
  var NN = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  var rainMg = makeMg(cv, W, H);

  var ui = load(await (await fetch('../midirain_ui.js')).text(), { jsarguments: ['midirain_ui.js'], mg: rainMg });
  var engine = load(await (await fetch('../midirain_engine.js')).text(), {
    jsarguments: ['midirain_engine.js', 'preview'],
    outlet: function (n) {
      var a = Array.prototype.slice.call(arguments, 1);
      if (n === 0) {
        notes.unshift(NN[a[0] % 12] + (Math.floor(a[0] / 12) - 2) + ' ' + a[1]);
        notes.length = Math.min(notes.length, 16);
        log.textContent = notes.join('  ');
      } else if (n === 1) ui.draw(a[1]);
    }
  });
  var knobs = [];
  var knobSrc = await (await fetch('../midirain_knob.js')).text();

  // mismas posiciones que en tools/build_device.py (layout A)
  var CX = 312, MX = CX + 140;
  function place(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; panel.appendChild(el); return el; }
  function lbl(text, x, y) { var d = document.createElement('div'); d.className = 'lbl'; d.textContent = text; place(d, x, y - 9); }

  // knobs: el jsui real encima de un "live.dial" simulado (arrastre vertical)
  function knob(label, x, y, lo, hi, expo, init, unit, fn) {
    var c = document.createElement('canvas');
    c.width = 60 * DPR; c.height = 72 * DPR;
    place(c, x, y);
    var mg = makeMg(c, 60, 72);
    var k = load(knobSrc, { jsarguments: ['midirain_knob.js', label, lo, hi, expo, init].concat(unit ? [unit] : []), mg: mg });
    var pos = Math.pow((init - lo) / (hi - lo), 1 / expo);
    function set() { var v = lo + (hi - lo) * Math.pow(pos, expo); k.msg_float(v); fn(v); }
    var y0 = null;
    c.addEventListener('pointerdown', function (e) { y0 = e.clientY; c.setPointerCapture(e.pointerId); });
    c.addEventListener('pointermove', function (e) {
      if (y0 === null) return;
      pos = Math.max(0, Math.min(1, pos + (y0 - e.clientY) / 150)); y0 = e.clientY; set();
    });
    c.addEventListener('pointerup', function () { y0 = null; });
    set();
    knobs.push({ mg: mg, k: k, set: function (p) { pos = p; set(); } });
  }
  knob('Density', CX, 4, 0, 100, 1, 30, '%', function (v) { engine.density(v); });
  knob('Fall', CX + 64, 4, 0, 100, 1, 40, '%', function (v) { engine.fall(v); });
  knob('Wind', CX, 86, -100, 100, 1, 10, '', function (v) { engine.wind(v); });
  knob('Length', CX + 64, 86, 10, 2000, 3, 150, 'ms', function (v) { engine.dur(v); });

  function select(label, x, y, w, items, init, fn) {
    lbl(label, x, y - 4);
    var s = document.createElement('select');
    s.innerHTML = items.map(function (it, i) { return '<option' + (i === init ? ' selected' : '') + '>' + it; }).join('');
    s.style.width = w + 'px';
    s.addEventListener('input', function () { fn(s.selectedIndex); });
    place(s, x, y); fn(init);
  }
  function number(label, x, y, init, fn) {
    lbl(label, x, y - 4);
    var n = document.createElement('input'); n.type = 'number'; n.min = 0; n.max = 127; n.value = init; n.style.width = '62px';
    n.addEventListener('input', function () { fn(+n.value); });
    place(n, x, y); fn(init);
  }

  lbl('Mode', MX, 14);
  var tabs = place(document.createElement('div'), MX, 18); tabs.className = 'tabs';
  ['Scale', 'MIDI'].forEach(function (t, i) {
    var b = document.createElement('button'); b.textContent = t; if (!i) b.className = 'on';
    b.addEventListener('click', function () {
      tabs.querySelectorAll('button').forEach(function (o) { o.className = ''; }); b.className = 'on'; engine.mode(i);
    });
    tabs.appendChild(b);
  });
  select('Root', MX, 50, 40, NN, 0, function (i) { engine.tonic(i); });
  select('Scale', MX + 46, 50, 84, ['Major', 'Minor', 'Dorian', 'Phrygian', 'Lydian', 'Mixolydian', 'Harmonic Minor',
    'Major Pentatonic', 'Minor Pentatonic', 'Blues', 'Chromatic'], 1, function (i) { engine.scale(i); });
  number('Low', MX, 82, 48, function (v) { engine.low(v); });
  number('High', MX + 68, 82, 72, function (v) { engine.high(v); });
  select('Sync', MX, 114, 62, ['Free', '1/32', '1/16', '1/8', '1/4'], 0, function (i) { engine.sync(i); });
  var credit = place(document.createElement('div'), 590 - 10 - 30, 169 - 17); credit.className = 'credit'; credit.textContent = 'mxnchv';

  window.midirain = { engine: engine, ui: ui, knobs: knobs, globals: globals };

  setInterval(engine.bang, 10);
  (function frame() {
    requestAnimationFrame(frame);
    rainMg.frame(ui.paint);
    knobs.forEach(function (o) { o.mg.frame(o.k.paint); });
  })();
})().catch(function (e) { document.getElementById('log').textContent = 'error: ' + e.message; throw e; });
</script>
</body>
</html>
